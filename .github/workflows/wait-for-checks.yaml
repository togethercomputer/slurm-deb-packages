name: Wait for checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-for-checks:
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Wait for all checks to complete
        uses: poseidon/wait-for-status-checks@e7e24423722c5b8e97a6dd5848827d2a412f812d # v0.7.0
        with:
          token: ${{ github.token }}
          delay: 60s
          timeout: 3600s
          ignore_pattern: "[Cc]odecov.*|.*[Bb]roly.*|.*[Rr]eview / [Rr]eview.*|[Cc]ursor [Bb]ugbot"
