# sync: true

name: Actionlint

on:
  pull_request:
    paths:
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  _:
    if: ${{ vars.ACTIONS_ENABLED == 'true' }}
    uses: togethercomputer/github-actions/.github/workflows/shared--actionlint.yaml@v1
