name: Build packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package family from .github/build-matrix.json
        type: choice
        options: [all, slurm, slurm-wlm-hop, pyxis, nccl-tests, perftest, cuda-samples, gdrcopy, cuda-mocks]
        default: slurm
        required: true
      distribution:
        description: Distribution filter (e.g. ubuntu24.04); empty builds all
        type: string
        default: ""
      version:
        description: Version filter (e.g. 25.11.8); empty builds all
        type: string
        default: ""
      release:
        description: Create GitHub releases from the build
        type: boolean
        default: true
      publish:
        description: Publish debs of publishable entries to Pulp
        type: boolean
        default: true
      republish_run_id:
        description: Skip the build and publish the artifacts of this earlier run
        type: string
        default: ""
  pull_request:
    paths:
      - .github/build-matrix.json
      - .github/scripts/select-builds.sh
      - .github/workflows/build.yaml
      - .github/workflows/build-one.yaml
      - cuda-mock-packages/**
      - cuda-samples/**
      - gdrcopy/**
      - nccl-tests/**
      - perftest/**
      - pyxis/**
      - slurm-packages/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      builds: ${{ steps.select.outputs.builds }}
      dependent_builds: ${{ steps.select.outputs.dependent_builds }}
      releases: ${{ steps.select.outputs.releases }}
      publish: ${{ steps.select.outputs.publish }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: List changed files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename' > "${RUNNER_TEMP}/changed.txt"
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/build-matrix.json?ref=${BASE_SHA}" \
            -H "Accept: application/vnd.github.raw" > "${RUNNER_TEMP}/base-matrix.json" || echo '[]' > "${RUNNER_TEMP}/base-matrix.json"

      - name: Select builds
        id: select
        env:
          TARGET: ${{ inputs.target }}
          DISTRIBUTION: ${{ inputs.distribution }}
          VERSION: ${{ inputs.version }}
          REPUBLISH_RUN_ID: ${{ inputs.republish_run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" == "pull_request" ]]; then
            .github/scripts/select-builds.sh .github/build-matrix.json "${RUNNER_TEMP}/changed.txt" "${RUNNER_TEMP}/base-matrix.json" | tee -a "${GITHUB_OUTPUT}"
          else
            .github/scripts/select-builds.sh .github/build-matrix.json | tee -a "${GITHUB_OUTPUT}"
          fi

  build:
    needs: select
    if: needs.select.outputs.builds != '[]'
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.select.outputs.builds) }}
    uses: ./.github/workflows/build-one.yaml
    with:
      entry: ${{ toJSON(matrix.entry) }}

  build-dependent:
    needs: [select, build]
    if: "!cancelled() && needs.select.outputs.dependent_builds != '[]'"
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.select.outputs.dependent_builds) }}
    uses: ./.github/workflows/build-one.yaml
    with:
      entry: ${{ toJSON(matrix.entry) }}

  release:
    needs: [select, build, build-dependent]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.release &&
      needs.select.outputs.releases != '[]'
    name: release ${{ matrix.id }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.releases) }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.id }}-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.name }}
          body: ${{ matrix.body }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/${{ matrix.files }}

  publish:
    needs: [select, build]
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish &&
      needs.select.outputs.publish != '[]' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    permissions:
      contents: read
      id-token: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.publish) }}
    uses: ./.github/workflows/publish-package.yaml
    with:
      instance: public-tcloud
      package_type: deb
      repository: together-public
      username: ci-publisher
      artifact_name: ${{ matrix.artifact }}
      artifact_run_id: ${{ inputs.republish_run_id }}
      artifacts: "*.deb"
      publish: true
